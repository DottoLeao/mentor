services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mentor
      POSTGRES_PASSWORD: mentor
      POSTGRES_DB: mentor
    ports:
      - "5433:5432"
    volumes:
      - mentor-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro

volumes:
  mentor-db:
