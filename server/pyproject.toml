[project]
name = "mentor-server"
version = "0.1.0"
description = "Servidor de conhecimento do Mentor: busca citada na documentação oficial, via MCP."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "uvicorn>=0.32",
    "starlette>=0.40",
]

[project.scripts]
mentor-index = "mentor_server.cli:index_main"
mentor-serve = "mentor_server.cli:serve_main"
mentor-eval-retrieval = "mentor_server.evals.retrieval:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentor_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: precisa de Postgres com pgvector (DATABASE_URL)",
    "slow: precisa do Ollama com bge-m3",
]
