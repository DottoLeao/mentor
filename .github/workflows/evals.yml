name: Evals de conversa

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/src/mentor_server/prompts/**"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conversas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      # Em PR de fork os segredos chegam vazios: o eval avisa e termina verde.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      EMBED_PROVIDER: workers_ai
      EVAL_MODELO_AGENTE: ${{ vars.EVAL_MODELO_AGENTE }}
      EVAL_MODELO_JUIZ: ${{ vars.EVAL_MODELO_JUIZ }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Rodar evals (pula com aviso sem OPENROUTER_API_KEY)
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::Segredo OPENROUTER_API_KEY ausente, pulando."
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Segredo DATABASE_URL ausente: o agente roda sem trechos da documentação."
          fi
          uv run mentor-eval-conversas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-conversas
          path: server/evals/out/conversas.json
          if-no-files-found: ignore
